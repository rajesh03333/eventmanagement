<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="./bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <style>
        body { background:lightblue; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .card { border: 0; border-radius: 10px; }
        .card.shadow-sm { box-shadow: 0 4px 18px rgba(23, 40, 70, 0.08); }
        .form-section { padding: 0.5rem 0 1rem; }
        .form-label { font-weight: 600; }
        .photo-preview { width: 120px; height: 120px; border-radius: 8px; overflow: hidden; background: #fafbfc; border: 1px solid #edf0f4; }
        .photo-preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .small-muted { font-size: 0.85rem; color: #6c757d; }
    </style>

    <div class="container py-5">
        <div class="card shadow-sm mx-auto " style="max-width:600px;">
            <div class="card-body p-4 ">
                <h3 class="mb-3">Student Registration</h3>
                <p class="small-muted">Please fill in the details below. Fields marked with * are required.</p>

                <form class="needs-validation" novalidate>
            <div class="form-row">
                <div class="form-group col-md-6">
                    <label for="fullname">Enter StudentName *</label>
                    <input type="text" class="form-control" id="fullname" required>
                    <div class="invalid-feedback">
                        Please provide your name.
                    </div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group col-md-6">
                    <label for="emailAddress">Enter Email *</label>
                    <input type="email" class="form-control" id="emailAddress" placeholder="you@example.com" required>
                    <div class="invalid-feedback">
                        Please enter a valid email address.
                    </div>
                </div>
                <div class="form-group col-md-6">
                    <label for="mobilenumber">Enter Mobile Number *</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text">+91</span>
                        </div>
                        <input type="tel" class="form-control" id="mobilenumber" pattern="\d{10}" maxlength="10" minlength="10" placeholder="1234567890" required>
                        <div class="invalid-feedback">
                            Please enter a 10-digit mobile number.
                        </div>
                    </div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group col-md-4">
                    <!-- <label for="qf">Qualification</label>
                    <input type="<div class="mb-3"> -->
                        <label for="quf" class="form-label">Branch *</label>
                        <select
                            class="form-select form-select-md"
                            name="branch"
                            id="branch"
                        >
                            <option selected>Select one</option>
                            <option value="cse">CSE</option>
                            <option value="ece">ECE</option>
                            <option value="eee">EEE</option>
                            <option value="aiml">AIML</option>
                            <option value="CSBS">CSBS</option>
                        </select>
                    </div>
            </div>

            <div class="form-row">
                <div class="form-group col-md-6">
                    <label for="emailAddress">Enter Roll Number *</label>
                    <input type="text" class="form-control" id="rollnumber"  required>
                </div>
                <div class="form-group col-md-6">
                    <label for="course" class="">Select Event</label>
                    <select class="form-control form-select" id="course" required>
                        <option value="" selected disabled>Choose...</option>
                        <option>Technical Quiz</option>
                        <option>Hackathon</option>
                        <option>Poster Presentation</option>
                        <option>Projext EXPO</option>
                         <option>Coding Contest</option>
                          <option>Cultural FEST</option>
                    </select>
                    <div class="invalid-feedback">
                        Please select a course.
                    </div>
                </div>
            </div>

                    <div class="form-row">
                        <div class="form-group col-md-6 d-flex align-items-end">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="terms" required>
                                <label class="form-check-label" for="terms">I agree to the Terms and Conditions</label>
                                <div class="invalid-feedback d-block">
                                    You must agree before submitting.
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-center">
                        <button class="btn btn-primary" type="submit" onclick="alert('Succesfully Submitted')">Register</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</body>

</html>
